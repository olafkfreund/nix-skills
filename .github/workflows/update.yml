name: Update references
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        skill: [nix-language, devenv-project, home-manager, microvm-nix, nix-darwin, nixos-operations, nixpkgs-development, nixos-wiki]
    concurrency:
      group: generate-${{ matrix.skill }}-references
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=
      - if: matrix.skill != 'nixos-wiki'
        run: python3 scripts/update.py --skill "${{ matrix.skill }}" --latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: matrix.skill == 'nixos-wiki'
        run: nix shell github:NixOS/nixpkgs/d4bff64ad63ff84484ef2204c1328924725c1c82#zstd --command python3 scripts/update.py --skill nixos-wiki --latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python3 scripts/check.py --skill "${{ matrix.skill }}" --base HEAD
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/artifact.py pack --skill "${{ matrix.skill }}" "$RUNNER_TEMP/references"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: references-${{ matrix.skill }}
          path: ${{ runner.temp }}/references/
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: generate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: nix-language
            branch: automation/nix-reference-update
          - skill: devenv-project
            branch: automation/devenv-reference-update
          - skill: home-manager
            branch: automation/home-manager-reference-update
          - skill: microvm-nix
            branch: automation/microvm-nix-reference-update
          - skill: nix-darwin
            branch: automation/nix-darwin-reference-update
          - skill: nixos-operations
            branch: automation/nixos-operations-reference-update
          - skill: nixpkgs-development
            branch: automation/nixpkgs-reference-update
          - skill: nixos-wiki
            branch: automation/nixos-wiki-reference-update
    concurrency:
      group: publish-${{ matrix.skill }}-references
      cancel-in-progress: false
    permissions:
      contents: read # pushes and PRs use UPDATE_PR_TOKEN, so update PRs get normal checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: references-${{ matrix.skill }}
          path: ${{ runner.temp }}/references
      - name: Verify base and accept only generated files
        id: artifact
        run: |
          python3 scripts/artifact.py accept --skill "${{ matrix.skill }}" "$RUNNER_TEMP/references" >> "$GITHUB_OUTPUT"
          git diff --check
      - name: Update one branch and PR
        if: steps.artifact.outputs.changed == 'true'
        env:
          UPDATE_PR_TOKEN: ${{ secrets.UPDATE_PR_TOKEN }}
          GH_TOKEN: ${{ secrets.UPDATE_PR_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SKILL: ${{ matrix.skill }}
          UPDATE_BRANCH: ${{ matrix.branch }}
        shell: bash
        run: |
          [ -n "$UPDATE_PR_TOKEN" ] || { echo '::error::UPDATE_PR_TOKEN is not set; update PRs are published with it.'; exit 1; }
          git switch -C "$UPDATE_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "skills/$SKILL"
          git commit -m "docs($SKILL): refresh upstream references"
          auth=$(printf 'x-access-token:%s' "$UPDATE_PR_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force-with-lease origin "$UPDATE_BRANCH"
          pr=$(gh pr list --head "$UPDATE_BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number // empty')
          body="$RUNNER_TEMP/references/report.md"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "docs($SKILL): refresh upstream references" --body-file "$body"
          else
            gh pr create --head "$UPDATE_BRANCH" --base "$DEFAULT_BRANCH" \
              --title "docs($SKILL): refresh upstream references" --body-file "$body" || {
              echo '::error::Cannot open update PR with UPDATE_PR_TOKEN. Check that the secret is set, valid, and allowed to open pull requests on this repository.'
              exit 1
            }
          fi
