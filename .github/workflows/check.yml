name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to validate (leave empty for current ref)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        skill: [nix-language, devenv-project]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=
      - run: python3 scripts/check.py --skill "${{ matrix.skill }}"
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/update.py --skill "${{ matrix.skill }}" --check
      - run: git diff --exit-code
